<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The 23 states of the car model: planar motion, track position, body motion and four corners</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="380" fill="#ffffff" stroke="#d1d5db"/>
  <!-- Panel A: top view -->
  <text x="20" y="28" font-weight="bold" fill="#111827">Top view: planar motion</text>
  <rect x="90" y="70" width="70" height="170" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <rect x="68" y="88" width="16" height="34" rx="3" fill="#374151"/>
  <rect x="166" y="88" width="16" height="34" rx="3" fill="#374151"/>
  <rect x="68" y="190" width="16" height="34" rx="3" fill="#374151"/>
  <rect x="166" y="190" width="16" height="34" rx="3" fill="#374151"/>
  <circle cx="125" cy="160" r="4" fill="#111827"/>
  <line x1="125" y1="160" x2="125" y2="62" stroke="#b91c1c" stroke-width="2" marker-end="url(#m)"/>
  <text x="132" y="60" fill="#b91c1c">vx</text>
  <line x1="125" y1="160" x2="40" y2="160" stroke="#b91c1c" stroke-width="2" marker-end="url(#m)"/>
  <text x="30" y="150" fill="#b91c1c">vy</text>
  <path d="M 100 182 A 36 36 0 0 0 150 182" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#m)"/>
  <text x="112" y="214" fill="#b91c1c">r</text>
  <text x="196" y="110" fill="#374151">wheel spin</text>
  <text x="196" y="126" fill="#374151">Om x 4</text>
  <text x="20" y="282" fill="#111827">vx, vy: speed forward and sideways</text>
  <text x="20" y="300" fill="#111827">r: yaw rate (turning speed)</text>
  <text x="20" y="318" fill="#111827">n, eps: place on the track</text>
  <!-- Panel B: side view -->
  <text x="280" y="28" font-weight="bold" fill="#111827">Side view: heave and pitch</text>
  <rect x="300" y="80" width="200" height="60" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="300" y="74" fill="#374151">front</text>
  <circle cx="400" cy="110" r="4" fill="#111827"/>
  <line x1="400" y1="110" x2="400" y2="52" stroke="#b91c1c" stroke-width="2" marker-end="url(#m)"/>
  <text x="408" y="58" fill="#b91c1c">zs (heave)</text>
  <path d="M 436 96 A 40 40 0 0 0 364 96" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#m)"/>
  <text x="440" y="78" fill="#b91c1c">theta (pitch)</text>
  <polyline points="330,140 322,150 338,158 322,166 338,174 330,184" fill="none" stroke="#374151" stroke-width="1.5"/>
  <polyline points="470,140 462,150 478,158 462,166 478,174 470,184" fill="none" stroke="#374151" stroke-width="1.5"/>
  <circle cx="330" cy="210" r="26" fill="#374151"/>
  <circle cx="470" cy="210" r="26" fill="#374151"/>
  <line x1="300" y1="238" x2="510" y2="238" stroke="#6b7280" stroke-width="2"/>
  <text x="300" y="262" fill="#374151">springs and dampers</text>
  <text x="280" y="300" fill="#111827">zs, theta and their rates: 4 states</text>
  <!-- Panel C: front view -->
  <text x="540" y="28" font-weight="bold" fill="#111827">Front view: roll and corners</text>
  <rect x="580" y="80" width="140" height="56" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <path d="M 690 70 A 46 46 0 0 0 610 70" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#m)"/>
  <text x="628" y="62" fill="#b91c1c">phi (roll)</text>
  <polyline points="598,136 590,146 606,154 590,162 606,170 598,180" fill="none" stroke="#374151" stroke-width="1.5"/>
  <polyline points="702,136 694,146 710,154 694,162 710,170 702,180" fill="none" stroke="#374151" stroke-width="1.5"/>
  <rect x="585" y="182" width="26" height="46" rx="4" fill="#374151"/>
  <rect x="689" y="182" width="26" height="46" rx="4" fill="#374151"/>
  <line x1="570" y1="196" x2="570" y2="170" stroke="#b91c1c" stroke-width="2" marker-end="url(#m)"/>
  <text x="548" y="164" fill="#b91c1c">wu</text>
  <polyline points="598,228 592,234 604,240 592,246 598,252" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <polyline points="702,228 696,234 708,240 696,246 702,252" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="560" y1="254" x2="740" y2="254" stroke="#6b7280" stroke-width="2"/>
  <text x="716" y="246" fill="#1d4ed8">zt</text>
  <text x="540" y="282" fill="#111827">phi and its rate: 2 states</text>
  <text x="540" y="300" fill="#111827">wu: unsprung speed, 4 corners</text>
  <text x="540" y="318" fill="#111827">zt: tyre deflection, 4 corners</text>
  <text x="20" y="356" font-weight="bold" fill="#111827">23 states in total: vx, vy, r, n, eps (5), wheel spin (4), body heave, pitch, roll and rates (6), unsprung (4), tyre (4)</text>
</svg>
