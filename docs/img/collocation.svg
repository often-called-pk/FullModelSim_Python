<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Direct collocation: the lap cut into intervals, one polynomial per state in each interval</title>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff" stroke="#d1d5db"/>
  <text x="20" y="28" font-weight="bold" fill="#111827">One state (for example the speed vx) along the lap</text>
  <line x1="60" y1="210" x2="730" y2="210" stroke="#1f2937" stroke-width="1.5" marker-end="url(#k)"/>
  <line x1="60" y1="210" x2="60" y2="50" stroke="#1f2937" stroke-width="1.5" marker-end="url(#k)"/>
  <text x="690" y="232" fill="#111827">s (distance)</text>
  <text x="30" y="46" fill="#111827">vx</text>
  <!-- knots -->
  <line x1="90" y1="60" x2="90" y2="214" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="290" y1="60" x2="290" y2="214" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="490" y1="60" x2="490" y2="214" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="690" y1="60" x2="690" y2="214" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <!-- piecewise cubic curves, continuous at the knots -->
  <path d="M 90 160 C 150 150 230 90 290 100" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M 290 100 C 350 108 420 175 490 170" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <path d="M 490 170 C 560 165 620 110 690 90" fill="none" stroke="#047857" stroke-width="2.5"/>
  <!-- knot values -->
  <circle cx="90" cy="160" r="6" fill="#111827"/>
  <circle cx="290" cy="100" r="6" fill="#111827"/>
  <circle cx="490" cy="170" r="6" fill="#111827"/>
  <circle cx="690" cy="90" r="6" fill="#111827"/>
  <!-- collocation points (3 inside each interval) -->
  <circle cx="113" cy="155" r="4.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="190" cy="129" r="4.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="267" cy="101" r="4.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="313" cy="106" r="4.5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="390" cy="141" r="4.5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="467" cy="168" r="4.5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="513" cy="166" r="4.5" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <circle cx="590" cy="137" r="4.5" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <circle cx="667" cy="96" r="4.5" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="150" y="232" fill="#374151">interval 1 (about 30 m)</text>
  <text x="350" y="232" fill="#374151">interval 2</text>
  <text x="550" y="232" fill="#374151">interval 3</text>
  <circle cx="80" cy="262" r="6" fill="#111827"/>
  <text x="92" y="267" fill="#111827">knot: start of an interval, where the pieces join</text>
  <circle cx="440" cy="262" r="4.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="452" y="267" fill="#111827">collocation point: the car's equations must hold here</text>
  <text x="80" y="290" fill="#111827">The solver moves every knot and point value until the equations hold everywhere and the lap time is lowest.</text>
</svg>
