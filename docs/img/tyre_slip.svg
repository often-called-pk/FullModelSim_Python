<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Tyre slip: slip angle, slip ratio and the force curve</title>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff" stroke="#d1d5db"/>
  <!-- Panel A: slip angle (top view) -->
  <text x="20" y="28" font-weight="bold" fill="#111827">Slip angle (seen from above)</text>
  <rect x="105" y="80" width="40" height="120" rx="10" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <line x1="125" y1="140" x2="125" y2="52" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
  <text x="118" y="60" fill="#1d4ed8" text-anchor="end">wheel points here</text>
  <line x1="125" y1="140" x2="175" y2="58" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>
  <text x="170" y="92" fill="#b91c1c">wheel moves here</text>
  <path d="M 125 100 A 40 40 0 0 1 146 106" fill="none" stroke="#111827" stroke-width="1.4"/>
  <text x="152" y="126" fill="#111827" font-size="14" font-weight="bold">alpha</text>
  <text x="20" y="232" fill="#111827">The tyre twists sideways and pushes</text>
  <text x="20" y="250" fill="#111827">the car round the corner. More angle</text>
  <text x="20" y="268" fill="#111827">gives more side force, up to a peak.</text>
  <!-- Panel B: slip ratio (side view) -->
  <text x="290" y="28" font-weight="bold" fill="#111827">Slip ratio (seen from the side)</text>
  <circle cx="385" cy="140" r="60" fill="#374151"/>
  <circle cx="385" cy="140" r="6" fill="#f9fafb"/>
  <path d="M 345 96 A 60 60 0 0 1 425 96" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#k)"/>
  <text x="358" y="78" fill="#92400e">spin Om</text>
  <line x1="385" y1="140" x2="470" y2="140" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>
  <text x="452" y="128" fill="#b91c1c">v (ground)</text>
  <line x1="385" y1="200" x2="300" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
  <text x="300" y="218" fill="#1d4ed8">Om R (surface)</text>
  <line x1="300" y1="200" x2="480" y2="200" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="290" y="250" fill="#111827">slip ratio = (Om R - v) / v</text>
  <text x="290" y="268" fill="#111827">Above 0: the wheel drives. Below 0:</text>
  <text x="290" y="286" fill="#111827">the wheel brakes. 0: free rolling.</text>
  <!-- Panel C: force against slip -->
  <text x="560" y="28" font-weight="bold" fill="#111827">Force against slip</text>
  <line x1="570" y1="220" x2="780" y2="220" stroke="#1f2937" stroke-width="1.5" marker-end="url(#k)"/>
  <line x1="570" y1="220" x2="570" y2="50" stroke="#1f2937" stroke-width="1.5" marker-end="url(#k)"/>
  <text x="742" y="240" fill="#111827">slip</text>
  <text x="540" y="46" fill="#111827">force</text>
  <path d="M 570 220 C 600 150 620 95 650 80 C 680 68 720 86 770 104" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="650" y1="80" x2="650" y2="220" stroke="#6b7280" stroke-dasharray="3 3"/>
  <text x="590" y="186" fill="#374151" transform="rotate(-62 590 186)">linear</text>
  <text x="628" y="70" fill="#374151">peak = mu Fz</text>
  <text x="704" y="124" fill="#374151">sliding</text>
  <text x="560" y="268" fill="#111827">The Magic Formula draws this</text>
  <text x="560" y="286" fill="#111827">curve from a few coefficients.</text>
</svg>
