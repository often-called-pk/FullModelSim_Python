name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Qt 6 needs these libraries to load. Same list as release.yml.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libegl1 libgl1 libfontconfig1 libdbus-1-3
      - run: uv sync --locked
      - run: uv run python tests/run_tests.py --quick
      - name: Setup script (Windows)
        if: runner.os == 'Windows'
        run: cmd /c start.bat --yes --no-gui --no-tests
      - name: Setup script (Linux)
        if: runner.os == 'Linux'
        run: ./start.sh --yes --no-gui --no-tests
